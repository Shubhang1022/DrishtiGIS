# Alembic configuration for DrishtiGIS
# Run from backend/ directory: alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .

# DATABASE_URL is injected from environment in alembic/env.py
# Do not set sqlalchemy.url here — it would expose secrets.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
